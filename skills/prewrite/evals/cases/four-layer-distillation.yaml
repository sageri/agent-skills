id: four-layer-distillation
title: 一句话塞了多件事时完成四层蒸馏并停在切入角度确认
description: |
  用户有素材，也能说出大概方向，但一句话里塞了多个主张，应走 B 的四层
  蒸馏。验证去噪、重组、压缩、延展四层都有明显压缩感，且不会直接写正文。

input:
  prompt: |
    我已经有这些材料：管理者远程后增加日报；员工自评产出上升；新人远程
    入职离职率更高；全远程团队靠周报和 demo 运转；会议数量翻倍。

    我想写的是：远程办公让管理更难、新人更难带，也许还会让中层管理岗位
    消失。大概就是这些，但这句话显然塞了太多东西。请先帮我理清，不要写正文。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "按去噪、重组、压缩、延展四层处理，层与层之间有明显压缩感"
    - "重组层形成 3 到 5 个逻辑要点块，并且每个标题都是完整判断句"
    - "压缩层给出一句有观点性、允许被反驳的核心主旨"
    - "延展层给出三个不同切入角度，各用一句话说明怎么切入"
    - "按读者相关性、反直觉和紧迫感推荐一个角度，并给出不超过 50 字的开头方向说明"
    - "把地图交回用户确认，没有写出正文，也没有直接进入 C 的三关"
  pass_threshold: 0.8
