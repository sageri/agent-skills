id: route-sharpen-claim
title: 已有判断句论点时先过第一关锋度检验，不跳到搭骨架
description: |
  用户能用一句判断句说清要写什么，应路由到 C 过三关，且顺序不能换：
  先做锋度检验，再搭骨架。验证 Agent 不会跳过第一关直接给 SCQA
  或大纲，并且给出强化版本后追问用户能否论证清楚。

input:
  prompt: |
    我要写一篇文章，核心观点是：远程办公正在让中层管理岗位加速消失。
    素材我攒得差不多了，动笔前想把思路理清楚。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "先做锋度检验，而不是直接给出 SCQA 骨架、大纲或分论点"
    - "覆盖四问：是否是有人会反对的主张、有没有说出读者没意识到的事、底层假设及其反例、反方最可能用来反驳的那一句话"
    - "给出一个不改核心意思但更有态度、更敢于被反驳的强化版本"
    - "交回时追问用户是否有能力在文章里把这个强化版本论证清楚"
    - "没有写出文章正文"
  pass_threshold: 0.8
