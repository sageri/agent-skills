id: route-cluster-overload
title: 素材多但说不出一句话时走 KJ 聚类，集群标题必须是判断句
description: |
  用户开场已经答了第二问（说不出一句话概括），按「用户一开口就答了的
  那问，跳过」应直接进 B / KJ 聚类。验证集群标题是完整判断句而不是
  名词词组、给出两个盲区、并把结果交回用户确认而不是自己往下冲。

input:
  prompt: |
    我攒了一堆关于远程办公的零散笔记，但完全说不出这篇文章到底要讲什么。

    - 我们公司去年加了日报和打卡，团队反而开始表演式办公
    - 某调研说 62% 的管理者认为远程降低了效率，但同一份调研里员工自评产出上升
    - 新人远程入职三个月后离职率是坐班的两倍多
    - 中层管理者是抱怨最多的一群人，上面要数据下面要空间
    - 我朋友的公司全远程五年了，从来不打卡，靠周报和 demo
    - 有篇文章说管理者焦虑的不是员工不干活，是自己不知道员工在干嘛
    - 我们团队最好的两个工程师都是彻底远程的
    - 会议数量在转远程后涨了大概一倍

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "把素材归成 3 到 5 个集群"
    - "每个集群的标题是完整的判断句（一个有人会反对的主张），而不是名词词组或客观描述"
    - "指出两个盲区：哪个方向证据明显不足，以及哪两个集群之间可能存在逻辑矛盾"
    - "把结果交回用户请他确认，而不是自己直接往下走到骨架或正文"
    - "没有写出文章正文"
  pass_threshold: 0.8
