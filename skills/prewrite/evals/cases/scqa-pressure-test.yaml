id: scqa-pressure-test
title: 锋度检验确认后用 SCQA 搭骨架并立即做两项压力测试
description: |
  验证 C 的第二关。用户确认强化论点能论证，知道大致方向但没有大纲时，
  Agent 应给出 SCQA，并对 S 和 C 分别作二值压力判断，然后停下等待确认。

input:
  turns:
    - role: user
      content: |
        我要写一篇文章，核心观点是：远程办公正在让中层管理岗位加速消失。
        素材已经够了，但我还没有大纲，先帮我把思路理清楚。
    - role: user
      content: |
        这个强化版我能论证清楚。我大致想说的是协作工具接管了信息中转，
        但还不知道文章骨架怎么搭。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "第 2 轮按 S 情境、C 冲突、Q 疑问、A 解答给出完整 SCQA 骨架"
    - "S 是目标读者认可的一到两句客观事实，C 是能推动文章的变化或矛盾"
    - "Q 用读者口吻提出一个核心问题，A 直接回答 Q 且保持核心论点"
    - "骨架后立即对 S 的读者认同度和 C 的冲击力分别给出「够用」或「需要调整」的判断"
    - "判为需要调整时说明具体怎么改，并把骨架交回用户确认"
    - "没有直接进入第三关，没有写文章正文"
  pass_threshold: 0.8
