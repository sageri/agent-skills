id: logic-chain-check
title: 已有骨架时第三关检查跳步偷换问题和反驳视角
description: |
  用户明确已经完成锋度检验和骨架，只要求第三关逻辑链检查。Agent 应指出
  问题位置和缺失前提，不替用户重写大纲，并在交付诊断后等待确认。

input:
  prompt: |
    我已经自己做完锋度检验和骨架，现在只做第三关，不要重写。

    核心观点：远程办公正在让中层管理岗位加速消失。
    分论点：
    1. 协作工具让信息同步不再依赖层级传递
    2. 远程团队的会议数量比坐班时更多
    3. 打卡和日报会降低员工信任
    4. 所以未来三年中层岗位会减少一半

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "明确检查跳步，指出从哪些分论点到结论之间缺了什么前提"
    - "明确检查偷换问题，判断现有分论点是否真正论证中层岗位消失，而不只是远程管理低效"
    - "明确给出反驳视角，指出不同意的读者最容易攻击哪个分论点以及目前是否防住"
    - "只指出问题位置和改进方向，没有替用户重写大纲或文章正文"
    - "交付诊断后等待用户确认，没有自行继续出口四项复核"
  pass_threshold: 0.8
