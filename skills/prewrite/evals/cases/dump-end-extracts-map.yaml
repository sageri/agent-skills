id: dump-end-extracts-map
title: 倒空结束后只提炼三项地图，再回到第二问
description: |
  验证 A 倒空收到【结束】后的出口行为。Agent 应从素材中提炼最有力量的
  判断、读者痛点和值得展开或多余的内容，不应直接写正文或越过确认继续搭骨架。

input:
  turns:
    - role: user
      content: |
        我想写远程办公，但手上没有整理过的笔记，也不知道怎么开头。
    - role: user
      content: |
        我发现管理层不是怕员工不工作，而是怕看不见工作过程，所以不断加
        打卡和日报。流程越多，大家越会表演自己在工作。新人确实也难带，
        但这可能是另一个话题。真正让我在意的是：很多管理动作只是为了缓解
        管理者自己的焦虑，并没有提高产出。【结束】

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "收到【结束】后的回复明确提炼了最有力量的一个判断，并且是完整判断句"
    - "明确指出了这个判断背后的读者痛点"
    - "区分了值得展开的想法和多余或应另行处理的内容"
    - "提炼后回到第二问，请用户确认能否用一句话说清文章要说什么，或请用户确认提炼出的判断"
    - "没有直接写文章正文，也没有越过用户确认继续给出 SCQA、完整大纲或三关结论"
  pass_threshold: 0.8
