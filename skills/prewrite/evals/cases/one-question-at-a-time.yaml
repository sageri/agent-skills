id: one-question-at-a-time
title: 开场模糊时只问第一问，不一次抛多个问题
description: |
  验证「一问一答」贯穿规则和第一步诊断的入口行为。用户开场没有透露
  手里有没有素材，也没说清晰度，Agent 应该只问第一问（有没有素材），
  等答完再问第二问，而不是一次把两问都抛出来或直接给方案。

input:
  prompt: |
    我想写一篇文章，但完全不知道从哪下手。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "只向用户提出了一个问题，没有一次抛出两个或更多需要用户回答的问题"
    - "提出的问题是「手里有没有素材（笔记、资料、案例、随手记下的碎片）」这一问"
    - "没有把第二问（能不能用一句话说出这篇文章要说什么）同时抛出来"
    - "没有直接给出集群、大纲、SCQA 骨架或文章正文"
  pass_threshold: 0.8
