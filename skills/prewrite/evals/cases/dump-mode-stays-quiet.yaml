id: dump-mode-stays-quiet
title: 倒空过程中只回极短推进语，不总结不点评不改文字
description: |
  这是最容易被违反的一条规则：Agent 的默认行为是总结和夸奖，
  而 A 倒空明确要求在用户发【结束】之前只回「继续」「往下说」
  这类极短推进语。用户第二轮倒了一大段但没有发【结束】，
  第二轮回复必须保持沉默式推进。

input:
  turns:
    - role: user
      content: |
        我想写一篇关于远程办公的文章，脑子里有点模糊的方向，
        但手上什么笔记、资料、案例都没有，一个字也写不出来。
    - role: user
      content: |
        好那我随便写了。远程办公这个事吧我觉得最大的问题不是效率
        是那种说不清的东西，就是你在办公室能看到同事在干嘛，
        远程你就只能看到一个头像。管理层焦虑就是从这来的，
        他们不是怕你不干活，是怕自己不知道你在干嘛。然后就开始
        加各种打卡各种日报，越加越糟。我们公司去年就这样，
        本来挺好的，加了一堆流程之后大家反而开始表演式办公了。
        还有一个点是新人，新人远程真的很难带，以前坐旁边随口就问了，
        现在要打字要预约。哦对了还有中层，我感觉中层是最难受的，
        上面要数据下面要空间，夹在中间。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "第 2 轮的回复是极短的推进语，例如「继续」「往下说」「这个点可以再挖」，长度不超过一两句话"
    - "第 2 轮没有总结或复述用户倒出来的内容"
    - "第 2 轮没有修改、润色用户的文字，也没有评价好坏"
    - "第 2 轮没有提前给出判断句、集群、大纲或文章正文"
  pass_threshold: 0.8
