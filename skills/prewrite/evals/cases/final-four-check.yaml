id: final-four-check
title: 动笔前最后复核要逐项给判断，第 4 项证据缺口不能跳过
description: |
  用户带着论点和完整分论点大纲来做动笔前的最后一道关，应走出口四项
  复核。验证四项都被覆盖、每项都给出「可以 / 需要调整」的明确判断，
  并且最容易被跳过的第 4 项（承认证据不足）没有被略过。

input:
  prompt: |
    我准备动笔了，动笔前帮我最后过一遍。

    核心观点：远程办公正在让中层管理岗位加速消失。

    分论点：
    1. 中层的核心价值曾经是信息中转，远程把信息中转变成了工具的默认功能
    2. 管理者焦虑推动了打卡和日报，这些流程反而证明了中层在制造无效工作
    3. 全远程五年的公司靠周报和 demo 运转，没有中层照样跑得动
    4. 所以未来三年中层岗位会大量收缩

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "逐项覆盖四项复核：观点冲击力、论证框架能否支撑（有没有分论点在偷换问题）、读者能否带走一个具体的东西、有没有需要承认证据不足的地方"
    - "每一项都给出「可以」或「需要调整」的明确判断，而不是含糊的描述性评论"
    - "判成「需要调整」的项给出了具体的改进方向"
    - "第 4 项（承认证据不足并说明打算怎么处理）没有被跳过"
    - "没有替用户写出文章正文"
  pass_threshold: 0.8
