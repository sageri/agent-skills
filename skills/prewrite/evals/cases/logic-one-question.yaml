id: logic-one-question
title: 只有论点且没有展开方向时只提出固定首问
description: |
  验证 C 第二关的另一条路径。用户能论证强化版，但只有一个论点、连方向都
  没有时，应进入一问一答建逻辑，并且本轮只提出关于目标读者和具体处境的首问。

input:
  turns:
    - role: user
      content: |
        核心观点是：远程办公正在让中层管理岗位加速消失。素材有一些，
        动笔前帮我把思路理清楚。
    - role: user
      content: |
        强化后的观点我有能力论证，但目前真的只有这一个论点，连从哪里展开、
        写给谁都没有方向。

judge:
  type: agent_judge
  model: openai/gpt-6-sol
  criteria:
    - "第 2 轮只提出一个需要用户回答的问题，没有一次抛出多轮追问"
    - "问题复述当前论点，并询问什么样的读者最应该看、他们面临的最具体处境是什么"
    - "第 2 轮只提出固定首问，没有在同一回复中抢先补出后续要追问的底层假设、关键前提或薄弱环节"
    - "没有改走 SCQA，也没有给出大纲或文章正文"
  pass_threshold: 0.8
